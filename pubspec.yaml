name: tomapp
description: A Flutter app to track Binance futures funding rates.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  intl: ^0.18.1
  provider: ^6.1.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  web_socket_channel: ^2.4.0
  flutter_background_service: ^5.0.10
  sqflite: ^2.3.0
  path: ^1.8.0
  fl_chart: ^0.65.0
  flutter_chen_kchart: ^2.0.4
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
