name: tomapp
description: A Flutter app to track Binance futures funding rates.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  intl: ^0.18.1
  provider: ^6.1.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  web_socket_channel: ^2.4.0
  flutter_background_service: ^5.0.10
  sqflite: ^2.3.0
  path: ^1.8.0
  fl_chart: ^0.65.0
  flutter_chen_kchart: ^2.0.4
  shimmer: ^3.0.0
  # Phase 6 data.binance.vision ZIP 解压用，本阶段先装入
  archive: ^4.0.2
  drift: ^2.19.1+1
  sqlite3_flutter_libs: ^0.5.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  drift_dev: ^2.19.1
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true
